name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tu_repe_db_test
          MYSQL_USER: tu_repe_test
          MYSQL_PASSWORD: test_password_not_for_prod_1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: cp .env.test.example .env.test
      - run: npm run migrate:test
      - run: npm test
      - run: npm run security:audit
      - run: docker build -t tu-repe-api:ci .
